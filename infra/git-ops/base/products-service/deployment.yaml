apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  labels:
    app.kubernetes.io/name: products-service
    app.kubernetes.io/part-of: team-workspace
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: products-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: products-service
        app.kubernetes.io/part-of: team-workspace
    spec:
      containers:
        # The container name is load-bearing: DEPLOYMENT_NAME below must equal it,
        # or this service appears as an orphaned root in every trace it takes part
        # in — while each individual log line still looks perfectly correct.
        - name: products-service
          image: registry.example.com/team-workspace/products-service:0.0.0-base
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4002
          env:
            - name: DEPLOYMENT_NAME
              value: products-service
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Per-environment configuration. The ConfigMap is generated by each
          # overlay from overlays/<env>/config/products-service.env, so a value that
          # differs between environments lives in exactly one place.
          envFrom:
            - configMapRef:
                name: products-service-env
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

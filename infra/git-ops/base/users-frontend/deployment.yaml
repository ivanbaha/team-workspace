apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-frontend
  labels:
    app.kubernetes.io/name: users-frontend
    app.kubernetes.io/part-of: team-workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: users-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: users-frontend
        app.kubernetes.io/part-of: team-workspace
    spec:
      containers:
        # The container name is load-bearing: DEPLOYMENT_NAME below must equal it,
        # or this service appears as an orphaned root in every trace it takes part
        # in — while each individual log line still looks perfectly correct.
        - name: users-frontend
          image: registry.example.com/team-workspace/users-frontend:0.0.0-base
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEPLOYMENT_NAME
              value: users-frontend
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Per-environment configuration. The ConfigMap is generated by each
          # overlay from overlays/<env>/config/users-frontend.env, so a value that
          # differs between environments lives in exactly one place.
          envFrom:
            - configMapRef:
                name: users-frontend-env
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

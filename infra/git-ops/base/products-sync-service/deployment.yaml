apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-sync-service
  labels:
    app.kubernetes.io/name: products-sync-service
    app.kubernetes.io/part-of: team-workspace
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: products-sync-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: products-sync-service
        app.kubernetes.io/part-of: team-workspace
    spec:
      containers:
        # The container name is load-bearing: DEPLOYMENT_NAME below must equal it,
        # or this service appears as an orphaned root in every trace it takes part
        # in — while each individual log line still looks perfectly correct.
        - name: products-sync-service
          image: registry.example.com/team-workspace/products-sync-service:0.0.0-base
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4003
          env:
            - name: DEPLOYMENT_NAME
              value: products-sync-service
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The shared-cache credential. The password never reaches the app as
            # its own variable: it exists only inside CACHE_URL below, so there is
            # no second copy to leak through logs, crash reports or /health.
            # CACHE_URL must come after it — $(…) expansion only sees variables
            # defined earlier in this list.
            - name: CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cache-credentials
                  key: products-sync-service
            # This service OWNS the category-stats prefix and RUNS the work queue
            # on the same server: its ACL user may read and write
            # `products-sync-service_*` only.
            - name: CACHE_URL
              value: "redis://products-sync-service:$(CACHE_PASSWORD)@cache:6379"
          # Per-environment configuration. The ConfigMap is generated by each
          # overlay from overlays/<env>/config/products-sync-service.env, so a
          # value that differs between environments lives in exactly one place.
          envFrom:
            - configMapRef:
                name: products-sync-service-env
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
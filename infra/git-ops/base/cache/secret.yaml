apiVersion: v1
kind: Secret
metadata:
  name: cache-credentials
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: team-workspace
type: Opaque
stringData:
  # ⚠ DEMO VALUES, in git, on purpose: this repository is a curated example, and
  # every credential in it is a placeholder. In a real deployment these come from
  # a secret manager (or sealed secrets) — never from a committed file — and they
  # must agree with the ACL file in acl-configmap.yaml, which repeats them.
  users-service: users-service-CHANGE-ME
  products-service: products-service-CHANGE-ME
  products-sync-service: products-sync-service-CHANGE-ME
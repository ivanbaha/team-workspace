# Production runs more replicas than dev/test. Kept as a named patch rather than a
# forked deployment.yaml, so a change to the base container spec still reaches prod.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
spec:
  replicas: 4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
spec:
  replicas: 4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-sync-service
spec:
  # Two, not four: the batch lock already collapses concurrent requests into one
  # drain per queue, and SPOP hands each category to exactly one drain — so extra
  # replicas buy availability, not throughput.
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-frontend
spec:
  replicas: 3
